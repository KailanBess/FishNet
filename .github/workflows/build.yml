name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build native Windows media app
        run: msbuild src/FishNet/FishNet.csproj /restore /p:Configuration=Release /p:Platform=x64
      - name: Publish runnable Windows app
        run: msbuild src/FishNet/FishNet.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir=${{ github.workspace }}/artifacts/FishNet/
      - uses: actions/upload-artifact@v4
        with:
          name: FishNet-windows-x64
          path: artifacts/FishNet/
          if-no-files-found: error
          retention-days: 14
