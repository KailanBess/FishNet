name: Windows release package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish complete native app
        shell: pwsh
        run: dotnet publish src/FishNet/FishNet.csproj -c Release -p:Platform=x64 -o artifacts/FishNet
      - name: Package and checksum
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE 'artifacts/FishNet'
          if (!(Test-Path "$publish/FishNet.exe") -or !(Test-Path "$publish/FishNet.pri")) {
            throw 'The executable or compiled XAML resources are missing.'
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "$publish/*" -DestinationPath release/FishNet-windows-x64.zip
          $hash = (Get-FileHash release/FishNet-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FishNet-windows-x64.zip" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: FishNet-release-package
          path: release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FishNet-release-package
          path: release
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "FishNet $RELEASE_TAG" --generate-notes
