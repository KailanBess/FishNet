name: Publish complete FishNet release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Require release source on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Publish complete self-contained Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          try {
            msbuild src/FishNet/FishNet.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir="$PWD/artifacts/FishNet/" 2>&1 | Tee-Object artifacts/build.log
            if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
            [xml]$project=Get-Content src/FishNet/FishNet.csproj
            $tag='v'+[string]$project.Project.PropertyGroup.Version
            if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag){throw 'Tag/source version mismatch.'}
            ./scripts/Package-Release.ps1 -PublishDirectory artifacts/FishNet -OutputDirectory artifacts/release -Tag $tag
          } catch {
            $reason=$_.Exception.Message
            $detail=$reason
            if(Test-Path artifacts/build.log){$detail+=[Environment]::NewLine+((Get-Content artifacts/build.log -Tail 60 | Where-Object {$_ -match '(?i)error|exception|failed'}) -join [Environment]::NewLine)}
            $escaped=$detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=FishNet release diagnostics::$escaped"
            "## FishNet release build failed`n$reason" | Add-Content $env:GITHUB_STEP_SUMMARY
            if(Test-Path artifacts/build.log){'```text' | Add-Content $env:GITHUB_STEP_SUMMARY; Get-Content artifacts/build.log -Tail 45 | Add-Content $env:GITHUB_STEP_SUMMARY; '```' | Add-Content $env:GITHUB_STEP_SUMMARY}
            throw
          }
      - name: Publish downloadable app and checksums
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'Complete unsigned FishNet Windows x64 app. Extract the entire ZIP into a new folder and run FishNet.exe. Keep its self-contained runtime files together. Media codecs depend on Windows; native playback and physical display acceptance remain manual checks. User profiles are not included. Verify SHA256SUMS.txt. Aquarium handles app installation and updates.'
          $notes | Set-Content artifacts/notes.txt -Encoding utf8
          $tag = 'v' + (Get-Content artifacts/release/BUILD-INFO.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $tag -ne 'v0.3.5') { return }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { return }
          gh release create $tag ./artifacts/release/FishNet-windows-x64.zip ./artifacts/release/SHA256SUMS.txt ./artifacts/release/BUILD-INFO.json --target $env:GITHUB_SHA --draft --title "FishNet $tag" --notes-file artifacts/notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
